; TrikiEmu — firmware emulatora kapsla Triki (BLE peripheral) na ESP32.
; Projekt jest PRZENOSNY: rdzen dziala na dowolnym ESP32 (Arduino + NimBLE).
; M5StickC Plus2 (ekran/przyciski/IMU/bateria) to opcja wlaczana flaga -D HAS_M5.

[platformio]
description = Software'owy emulator kapsla Zabka Triki (ESP32 BLE peripheral) — RE/interop
default_envs = m5stickc_plus2
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2

; --- Goly ESP32 (np. ESP32 DevKit). Sterowanie WYLACZNIE z PC po USB-serial:
;     M,gx,gy,gz,ax,ay,az | R | BLE,1 | BLE,0. Startuje z reklama ON. ---
[env:esp32dev]
board = esp32dev

; --- M5StickC Plus2 (ESP32-PICO-V3-02). Dodaje ekran/przyciski/IMU/bateria. ---
; Brak dedykowanego boardu Plus2 — bazujemy na m5stick-c (4 MB; 8 MB nieuzywane).
; NIE wymuszamy 8 MB/partycji — niezgodnosc z 4 MB bootloaderem = petla resetow.
[env:m5stickc_plus2]
board = m5stick-c
build_flags = -D HAS_M5
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified @ ^0.1.16

; LilyGo T-Embed-CC1101 (ESP32-S3, 16 MB flash, 8 MB PSRAM).
; The board has no IMU, so motion is supplied through the existing USB-serial
; protocol. The user key toggles BLE advertising and the encoder key wakes the
; display when it has been dimmed.
[env:t_embed_cc1101]
board = T_Embed_PN532
build_flags =
    -D HAS_T_EMBED_CC1101
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED
    -include $PROJECT_DIR/include/t_embed_tft_setup.h
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
